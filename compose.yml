services:
  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
      args:
        # 可选镜像源加速（留空用上游默认），如 APT_MIRROR_HOST=mirrors.aliyun.com
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-}
    container_name: dockore-backend
    ports:
      - "${DOCKORE_PORT:-8000}:8000"
    environment:
      - DOCKORE_HOST=0.0.0.0
      - DOCKORE_PORT=8000
      - DOCKORE_TOKEN=${DOCKORE_TOKEN:-change-me}
      - DOCKORE_CORS_ORIGINS=${DOCKORE_CORS_ORIGINS:-*}
      - DOCKORE_DATA_DIR=/app/data
      # Stack 管理：宿主机与容器内路径必须一致（DOCKORE_STACKS_DIR 两侧同值），
      # 否则 stack compose 文件中的相对 bind 路径无法解析
      - DOCKORE_STACKS_DIR=${DOCKORE_STACKS_DIR:-/app/stacks}
      # 栈备份：容器模式必须设置（两侧同路径挂载，原因同上）；不设置则备份功能禁用
      # - DOCKORE_BACKUPS_DIR=${DOCKORE_BACKUPS_DIR}
      # 系统监控：backend 通过 /host/proc 读取宿主机指标（psutil）
      - DOCKORE_HOST_PROC=/host/proc
    volumes:
      - ./data:/app/data
      # Dockore 是 Docker 管理工具，需要访问宿主机容器 daemon
      # Podman 用户改为 podman socket 路径，如 /run/user/1000/podman/podman.sock
      - ${DOCKORE_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${DOCKORE_STACKS_DIR:-/app/stacks}:${DOCKORE_STACKS_DIR:-/app/stacks}
      # 栈备份目录：与 DOCKORE_BACKUPS_DIR 配套，宿主机与容器内路径保持一致
      # - ${DOCKORE_BACKUPS_DIR}:${DOCKORE_BACKUPS_DIR}
      # 系统监控：只读挂载宿主机 /proc（Docker Desktop 下为 VM 指标）
      - /proc:/host/proc:ro
      # 主机名透传：/proc/sys/kernel/hostname 是 UTS namespace 虚拟化的，只能挂 /etc/hostname
      - /etc/hostname:/etc/host_hostname:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile
      args:
        # 可选 npm registry（留空用默认），如 NPM_REGISTRY=https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: dockore-frontend
    ports:
      - "${DOCKORE_FRONTEND_PORT:-8001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 不用 busybox wget：个别内核上它在容器内会挂起（实测 postmarketOS msm8956 mainline）
      test: ["CMD", "sh", "-c", "printf 'GET /index.html HTTP/1.0\\r\\n\\r\\n' | nc -w 3 127.0.0.1 80 | grep -q '200 OK'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  proxy:
    build:
      context: .
      dockerfile: ./src/proxy/Dockerfile
    container_name: dockore-proxy
    ports:
      - "${DOCKORE_PROXY_PORT:-8002}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
